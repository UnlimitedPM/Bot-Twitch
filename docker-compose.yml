services:
  bot:
    build: .
    container_name: bot-twitch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Fuseau des horodatages de logs : sans ca le conteneur log en UTC.
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # Le token OAuth est persiste ici pour survivre aux redemarrages.
      - ./data:/app/data
